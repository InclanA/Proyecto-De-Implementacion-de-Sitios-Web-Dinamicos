<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/register.css">
</head>
<body>
<header>
    <a href="../index.html">
    <img src="../img/logo.png" >
    </a>
</header>
<section>
<form id="form" action="login.html">
<h2>Registrarse</h2>
    <p>
        <a href="login.html">Ya tengo cuenta</a>
    </p>
<div>
    <label>email</label>
    <input type="email" id="mail" required>
</div>
<div>
    <label>contraseña</label>
    <input type="password" id="contraseñaa" required>
</div>
    <button type="submit" id="registrar">Registrarse</button>
</form>
</section>
</main>

<script>
    const registrar = document.getElementById("registrar");
    registrar.addEventListener("click", () => {
    const email = document.getElementById("mail").value.trim();
    const password = document.getElementById("contraseñaa").value.trim();
        
    if (email === "" || password === "") {
        alert("tenes que completar todos los campos para poder registrarte");
            return;
    }
        localStorage.setItem("registrado", JSON.stringify({ email, password }));
            alert("tu registro fue exitoso");
    });
</script>
</body>
</html>
