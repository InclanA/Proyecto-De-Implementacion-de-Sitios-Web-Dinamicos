<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <header>
        <h1 class="center">Venta de Hardware</h1>
        <nav>
            <a href="#">Productos</a>
            <a href="#">Ofertas</a>
            <a href="carrito.html">Carrito (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section class="center">
            <img src="./img/BANNER.png" alt="Banner" style="max-width:100%;border-radius:8px">
        </section>

        <h2>Lista de Componentes</h2>
        <section class="products" id="products">
            <article class="product" data-name="AMD Ryzen 7 7800X3D" data-description="Procesador AMD Ryzen 7 7800X3D." data-price="$450.000" data-img="./img/Ryzen7.png">
                <img src="./img/Ryzen7.png" alt="Ryzen7">
                <h3>AMD Ryzen 7 7800X3D</h3>
                <div class="muted">Procesador</div>
                <div class="row"><div class="price">$450.000</div><button class="btn add-to-cart">Agregar</button></div>
            </article>

            <article class="product" data-name="NVIDIA GeForce RTX 4070" data-description="Placa de video NVIDIA GeForce RTX 4070." data-price="$850.000" data-img="./img/RTX.png">
                <img src="./img/RTX.png" alt="RTX">
                <h3>NVIDIA GeForce RTX 4070</h3>
                <div class="muted">Placa de video</div>
                <div class="row"><div class="price">$850.000</div><button class="btn add-to-cart">Agregar</button></div>
            </article>

            <article class="product" data-name="Corsair Vengeance 32GB DDR5" data-description="Memoria RAM DDR5 de 32GB." data-price="$180.000" data-img="./img/RAM.png">
                <img src="./img/RAM.png" alt="RAM">
                <h3>Corsair Vengeance 32GB DDR5</h3>
                <div class="muted">Memoria RAM</div>
                <div class="row"><div class="price">$180.000</div><button class="btn add-to-cart">Agregar</button></div>
            </article>

            <article class="product" data-name="SSD NVMe 1TB" data-description="Almacenamiento SSD NVMe de 1TB." data-price="$120.000" data-img="./img/SSD.jpg">
                <img src="./img/SSD.jpg" alt="SSD">
                <h3>SSD NVMe 1TB</h3>
                <div class="muted">Almacenamiento</div>
                <div class="row"><div class="price">$120.000</div><button class="btn add-to-cart">Agregar</button></div>
            </article>
        </section>
    </main>

    <footer class="center muted">Contacto: inclanxd@gmail.com</footer>
</div>

<script>
    const readCart = () => JSON.parse(localStorage.getItem('cart')||'[]');
    const saveCart = c => localStorage.setItem('cart', JSON.stringify(c));
    const updateCartCount = () => { const el = document.getElementById('cart-count'); if(el) el.textContent = readCart().length; };
    const addToCart = p => { const c = readCart(); c.push(p); saveCart(c); updateCartCount(); alert('Agregado al carrito'); };

    document.addEventListener('click', (e)=>{
        const add = e.target.closest('.add-to-cart');
        if(add){
            e.stopPropagation();
            const art = add.closest('.product');
            addToCart({name: art.dataset.name, description: art.dataset.description, price: art.dataset.price, img: art.dataset.img});
            return;
        }
        const art = e.target.closest('.product');
        if(art) {
            const q = new URLSearchParams({name: art.dataset.name, description: art.dataset.description, price: art.dataset.price, img: art.dataset.img});
            window.location.href = 'productos.html?'+q.toString();
        }
    });

    document.addEventListener('DOMContentLoaded', updateCartCount);
</script>
</body>
</html>
